[project]
name = "xhs-rag"
version = "0.1.0"
description = "小红书收藏夹 RAG：把收藏过的笔记变成可搜索、可问答、能回溯原帖的个人知识库"
requires-python = ">=3.11"
readme = "README.md"

# M0 阶段只依赖这些，装得快。后续阶段的依赖见下方可选组。
dependencies = [
    "playwright>=1.44",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "qrcode>=7.4",
    "pillow>=10.0",
    "requests>=2.31",
    "loguru>=0.7",
]

[project.optional-dependencies]
# M3 起：OCR
ocr = [
    "rapidocr-onnxruntime>=1.3",
    "numpy>=1.26",
]
# M5 起：向量库与检索
index = [
    "lancedb>=0.10",
    "pyarrow>=16.0",
]
# M6 起：Web UI（标准库 http.server 实现，零额外依赖）
serve = []
# M7 起：调度
schedule = [
    "apscheduler>=3.10",
]

[project.scripts]
xhs = "xhs_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xhs_rag = ["../../assets/*.js"]
