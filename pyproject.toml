[project]
name = "xhs-rag"
version = "0.1.0"
description = "小红书收藏夹 RAG：把收藏过的笔记变成可搜索、可问答、能回溯原帖的个人知识库"
requires-python = ">=3.11"
readme = "README.md"

# M0 阶段只依赖这些，装得快。后续阶段的依赖见下方可选组。
dependencies = [
    "playwright>=1.44",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "qrcode>=7.4",
    "pillow>=10.0",
    "requests>=2.31",
    "loguru>=0.7",
]

[project.optional-dependencies]
# M3 起：OCR
# ★ py3.13 兼容坑（2026-09-03 换机实测）：rapidocr-onnxruntime 1.3.x 全部
#   requires-python <3.13，装不上；1.2.3 及以下无版本上限，3.13 可用。勿再升回 >=1.3。
ocr = [
    "rapidocr-onnxruntime>=1.2.3",
    "numpy>=1.26",
]
# M5 起：向量库与检索
# jieba: hybrid 检索(BM25+RRF)的中文预分词,纯 Python 零原生依赖
index = [
    "lancedb>=0.10",
    "pyarrow>=16.0",
    "jieba>=0.42",
]
# ★ 本地 embedding/rerank 还需要 torch(CPU) + flagembedding + modelscope，未写入依赖：
#   torch 分平台（CPU/CUDA），写死会拉 ~2.5GB CUDA 版。按环境手动装：
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install flagembedding modelscope
#   模型文件（bge-m3 / bge-reranker-v2-m3）在 data/models/ 随数据迁移，不属 pip 管。
# M6 起：Web UI（标准库 http.server 实现，零额外依赖）
serve = []

[project.scripts]
xhs = "xhs_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xhs_rag = ["../../assets/*.js"]
